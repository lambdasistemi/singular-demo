site_name: Singular demos
site_description: "Demonstrations of Singular on a private Cardano test chain: read a run, play it in the browser, or play it in a Codespace."
site_url: https://lambdasistemi.github.io/singular-demo/
repo_url: https://github.com/lambdasistemi/singular-demo
docs_dir: docs
theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - toc.follow
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Demo 1:
      - Overview: demo1/index.md
      - A run: demo1/run.md
      - The annotated script, as it ran: demo1/script-run.md
      - The tutorial: demo1/tutorial.md
exclude_docs: |
  build.sh
