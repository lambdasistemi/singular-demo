<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singular Demo 1 steps</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1d2024; --muted:#5b6470; --card:#ffffff; --line:#d9dde2; --code:#0f1720; --codefg:#e8edf2; --accent:#1f6feb; --ok:#1a7f37; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14171a; --fg:#e6e9ed; --muted:#9aa4b0; --card:#1b1f24; --line:#2c333b; --code:#0b0e11; --codefg:#e6e9ed; --accent:#58a6ff; --ok:#3fb950; } }
  :root[data-theme="dark"] { --bg:#14171a; --fg:#e6e9ed; --muted:#9aa4b0; --card:#1b1f24; --line:#2c333b; --code:#0b0e11; --codefg:#e6e9ed; --accent:#58a6ff; --ok:#3fb950; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:20px 16px 8px; max-width:980px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  header p { margin:0; color:var(--muted); }
  nav { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 16px; display:flex; flex-wrap:wrap; gap:6px; z-index:2; max-width:980px; margin:0 auto; }
  nav a { color:var(--accent); text-decoration:none; padding:2px 8px; border:1px solid var(--line); border-radius:999px; font-size:.85rem; }
  nav a.done { color:var(--ok); border-color:var(--ok); }
  main { max-width:980px; margin:0 auto; padding:0 16px 80px; }
  .step { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:18px 0; }
  .step.is-done { opacity:.62; }
  h2 { font-size:1.15rem; margin:0 0 8px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .num { background:var(--accent); color:#fff; border-radius:999px; min-width:1.7em; text-align:center; font-size:.85rem; padding:1px 8px; }
  .done { margin-left:auto; font-size:.85rem; font-weight:400; color:var(--muted); display:flex; align-items:center; gap:6px; }
  p { margin:8px 0; }
  code { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:.9em; }
  p code { background:rgba(127,127,127,.18); padding:1px 5px; border-radius:4px; }
  .block { position:relative; margin:10px 0; }
  pre { background:var(--code); color:var(--codefg); border-radius:8px; padding:14px 90px 14px 14px; margin:0; overflow-x:auto; font-size:.92rem; line-height:1.5; }
  pre code { font-size:inherit; }
  .copy { position:absolute; top:8px; right:8px; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 12px; font:inherit; font-size:.85rem; cursor:pointer; }
  .copy.ok { background:var(--ok); }
  .copy:focus-visible, nav a:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  @media (max-width:560px) { body { font-size:16px; } pre { padding-right:14px; padding-top:44px; } }
</style>
</head>
<body>
<header>
  <h1>Singular Demo 1, step by step</h1>
  <p>Release v0.12.0 on a private test chain. Copy a block, paste it into one terminal, run it, go to the next. Nothing touches a public network.</p>
</header>
<nav><!--NAV--></nav>
<main>
<!--STEPS-->
</main>
<script>
(function () {
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  document.querySelectorAll('.copy').forEach(function (b) {
    b.addEventListener('click', function () {
      var text = b.parentNode.querySelector('code').textContent;
      if (!/\n$/.test(text)) text += '\n'; // end with a line return, so the last command runs when pasted
      function ok() { b.textContent = 'Copied'; b.classList.add('ok'); setTimeout(function () { b.textContent = 'Copy'; b.classList.remove('ok'); }, 1400); }
      function fallback() {
        var t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
        document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); ok(); } catch (e) { b.textContent = 'Select and copy'; }
        document.body.removeChild(t);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
    });
  });
  document.querySelectorAll('input[data-step]').forEach(function (c) {
    var i = c.getAttribute('data-step'), sec = document.getElementById('s' + i), link = document.querySelectorAll('nav a')[i];
    function apply() { sec.classList.toggle('is-done', c.checked); if (link) link.classList.toggle('done', c.checked); }
    c.checked = store('singular-demo-step-' + i) === '1'; apply();
    c.addEventListener('change', function () { store('singular-demo-step-' + i, c.checked ? '1' : '0'); apply(); });
  });
})();
</script>
</body>
</html>
