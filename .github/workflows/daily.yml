name: daily

# Every day: rebuild the Ubuntu kit of the pinned Singular release from flake.lock,
# prove it by the full 16-step demo in a clean Ubuntu 24.04 container, and publish
# the kit with the proof to the single rolling release "daily", and publish the documentation site built from
# the same runs. Every merge into main does the same.
# A pull request builds and tests only; it never publishes.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/kit.yml
    permissions:
      contents: read

  publish:
    name: Publish to the daily release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # Until the new files are all in place the notes say so, so they never describe files
      # that are not there. If this job dies half way, that note stays and is true.
      - name: Mark the release as being updated
        run: |
          run_url="${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
          note="Being updated by ${run_url}. Until that run finishes the files here may come from two different days. If this note stays, that run failed while publishing; the last complete day is in the run history."
          if gh release view daily > /dev/null 2>&1; then
            gh release edit daily --prerelease --latest=false --notes "$note"
          else
            gh release create daily --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Daily kit" --notes "$note"
          fi

      - name: Replace the files
        run: gh release upload daily release/*.tar.gz release/SHA256SUMS release/demo-run.log release/run-summary.json --clobber

      - name: Move the tag to this commit
        run: gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/daily" -f sha="$GITHUB_SHA" -F force=true

      - name: Write the notes
        run: |
          title="Daily kit, $(jq -r '.date[:10]' release/run-summary.json)"
          gh release edit daily --prerelease --latest=false --title "$title" --notes-file release/notes.md

  pages:
    name: Publish the documentation site
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
