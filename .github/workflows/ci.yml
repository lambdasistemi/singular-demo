name: CI

# Every pull request builds the Ubuntu kit of the pinned Singular release, checks the repository, proves the
# kit in a clean Ubuntu, plays the tutorial and its three environments (the Killercoda scenarios, the kit's
# stepper play in a terminal and the Codespaces tutorial) on that kit, and builds the documentation site from the
# logs of those runs. publish.yml and release.yml call this workflow and publish what it produced. One job
# dry-runs the Homebrew formula publishing against the latest published release, so a tool missing from the
# nixos runner (as curl was in issue 31) fails the pull request instead of the next release.
#
# Jobs that need Nix run on the self-hosted nixos runners, after the Build Gate has built everything once.
# Six jobs need a real Ubuntu with Docker or the browser's system libraries, which the nixos runners do not
# have, and run on a GitHub-hosted runner: the clean-Ubuntu proof of the kit, the Killercoda scenarios (they
# run on an Ubuntu machine), the kit's stepper play (in a clean Ubuntu container), the pay-by-name scenario and its
# controls (in a clean Ubuntu container) and the Codespaces tutorial (it runs in an Ubuntu container). One more
# job runs on a GitHub-hosted macOS runner: it installs the Homebrew formula from a temporary local tap and
# plays Demo 1's shortest path, which cannot be proved on Linux.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. A run called from another workflow has no pull
# request number and gets a group of its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  UBUNTU_IMAGE: mirror.gcr.io/library/ubuntu:24.04
  # A pull request plays every whole run with the least windows the registry allows (60 s to process a request,
  # 30 s to take it back), so its waits on the chain last a minute instead of several. The runs of main, the
  # nightly run and a release, whose logs are published, keep the windows the tutorial and demo.sh write.
  PROCESS_TIME_MS: ${{ github.event_name == 'pull_request' && '60000' || '' }}
  RETRACT_TIME_MS: ${{ github.event_name == 'pull_request' && '30000' || '' }}

jobs:
  build-gate:
    name: Build Gate
    runs-on: nixos
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Nothing may be compiled
        run: kit/guard.sh .#kit .#kit-verify .#pay-by-name-sink .#pay-by-name-tools .#docs-env .#devShells.x86_64-linux.default .#devShells.x86_64-linux.pay-by-name .#devShells.x86_64-linux.dev
      - name: Build everything the jobs below use
        run: >-
          nix build --quiet --no-link
          .#kit
          .#kit-verify
          .#pay-by-name-sink
          .#pay-by-name-tools
          .#docs-env
          .#tutorial-stepper
          .#devShells.x86_64-linux.default.inputDerivation
          .#devShells.x86_64-linux.pay-by-name.inputDerivation
          .#devShells.x86_64-linux.dev.inputDerivation

  checks:
    name: CI checks
    needs: build-gate
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Flake checks (format, lint, generated files, the README's version)
        run: nix flake check --no-eval-cache
      - name: The Homebrew formulas render from their templates
        run: bash homebrew/test-render.sh

  tap-dry-run:
    name: CI tap publishing
    # The publishing runs only on a tag push, where curl once missed from the runner: this job runs the
    # publishing test against the latest published release on every pull request, so a tool missing from
    # the dev shell fails here instead of in the release.
    needs: build-gate
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Dry-run the formula publishing from the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(nix develop .#dev --command gh release view --json tagName --jq .tagName)
          nix develop .#dev --command bash homebrew/test-publish-tap.sh "$TAG"

  kit:
    name: CI kit
    needs: build-gate
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: The shell starts
        run: nix develop --command kit/smoke.sh
      - name: Build the kit
        run: |
          nix build .#kit --print-build-logs --out-link kit-result
          nix build .#pay-by-name-tools --print-build-logs --out-link tools-result
          mkdir dist
          cp kit-result/* dist/
          # the controls only the pay-by-name test runs; they are not part of the kit
          cp tools-result/controls.cjs dist/
          nix --version > dist/nix-version.txt
          ls -l dist
          cat dist/SHA256SUMS
      - name: Verify the tarball contents
        run: nix run .#kit-verify
      - name: Pack the pay-by-name tools for the Homebrew formula
        run: |
          TOOLS=$(nix build .#pay-by-name-tools --print-out-paths --no-link)
          SINK=$(nix build .#pay-by-name-sink --print-out-paths --no-link)
          mkdir -p pr-tools
          stage=$(mktemp -d)
          cp "$TOOLS/sink-tools.cjs" "$stage/"
          cp "$SINK" "$stage/plutus.json"
          tar --sort=name --mtime="@1" -czf pr-tools/pay-by-name-tools.tar.gz -C "$stage" sink-tools.cjs plutus.json
          rm -rf "$stage"
          tar tzf pr-tools/pay-by-name-tools.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pay-by-name-tools
          path: pr-tools/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit
          path: dist/
          if-no-files-found: error
          retention-days: 3

  runbook:
    name: CI runbook
    needs: build-gate
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Every step of the tutorial, played with the stepper, against a fresh devnet
        env:
          STEPPER_PATH: ${{ github.event_name == 'pull_request' && 'short' || 'tutorial' }}
        run: |
          rm -rf /tmp/stepper-run /tmp/stepper-transcript.toml
          nix develop --command tutorial-stepper play --auto demos/demo1 --path "$STEPPER_PATH" --run /tmp/stepper-run --run-setup --transcript /tmp/stepper-transcript.toml
          nix develop --command bash demos/demo1/play/check-receipts.sh /tmp/stepper-run
      - name: Keep the transcript of the run
        if: always()
        run: |
          mkdir -p runbook-out
          cp /tmp/stepper-transcript.toml runbook-out/stepper-transcript.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runbook-transcript
          path: runbook-out/
          if-no-files-found: warn
          retention-days: 14

  runbook-pay-by-name:
    name: CI pay-by-name stepper
    needs: build-gate
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Every step of the pay-by-name story, played with the stepper, against a fresh devnet
        run: |
          rm -rf /tmp/pay-by-name-run /tmp/pay-by-name-transcript.toml
          nix develop .#pay-by-name --command tutorial-stepper check demos/pay-by-name
          nix develop .#pay-by-name --command tutorial-stepper play --auto demos/pay-by-name --run /tmp/pay-by-name-run --run-setup --transcript /tmp/pay-by-name-transcript.toml
          nix develop .#pay-by-name --command bash demos/pay-by-name/check-run.sh /tmp/pay-by-name-run
      - name: Keep the transcript of the run
        if: always()
        run: |
          mkdir -p pay-by-name-out
          cp /tmp/pay-by-name-transcript.toml pay-by-name-out/pay-by-name-transcript.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pay-by-name-transcript
          path: pay-by-name-out/
          if-no-files-found: warn
          retention-days: 14

  clean-room:
    name: CI clean Ubuntu
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: dist
      - name: Pull the Ubuntu image
        id: image
        run: |
          docker pull "$UBUNTU_IMAGE"
          ref=$(docker image inspect "$UBUNTU_IMAGE" --format '{{json .RepoDigests}}' \
            | jq -r --arg r "${UBUNTU_IMAGE%:*}@" '.[] | select(startswith($r))')
          [ -n "$ref" ] || { echo "no digest for $UBUNTU_IMAGE" >&2; exit 1; }
          echo "image $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
      - name: Demo in clean Ubuntu 24.04 (16 steps, no /nix, no network)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          OUT: out
        run: TARBALL=$(ls dist/*.tar.gz) kit/container-run.sh good
      - name: Demo with the shortest allowed windows (60 s and 30 s)
        # a pull request already ran the demo above with these windows
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          OUT: out
        run: TARBALL=$(ls dist/*.tar.gz) kit/container-run.sh short
      - name: Failing control, windows below the least allowed (must be refused)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          OUT: out
        run: TARBALL=$(ls dist/*.tar.gz) kit/container-run.sh control-window
      - name: Failing control, a library of the programs removed (must fail)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          OUT: out
        run: TARBALL=$(ls dist/*.tar.gz) kit/container-run.sh control-main
      - name: Failing control, a library of cardano-node removed (must fail)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          OUT: out
        run: TARBALL=$(ls dist/*.tar.gz) kit/container-run.sh control-node
      - name: Summary and release files
        env:
          DIST: dist
          LOG: out/container-run-good.log
          IMAGE_REF: ${{ env.UBUNTU_IMAGE }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KIT_COMMIT: ${{ github.sha }}
        run: |
          NIX_VERSION=$(cat dist/nix-version.txt)
          RUNNER_IMAGE="${ImageOS:-unknown} ${ImageVersion:-unknown}"
          export NIX_VERSION RUNNER_IMAGE
          mkdir release
          kit/summary.sh json > release/run-summary.json
          cat release/run-summary.json
          [ "$(jq -r .result release/run-summary.json)" = pass ]
          SUMMARY=release/run-summary.json kit/summary.sh notes > release/notes.md
          SUMMARY=release/run-summary.json kit/summary.sh release-notes > release/release-notes.md
          cp dist/*.tar.gz dist/SHA256SUMS release/
          cp out/container-run-good.log release/demo-run.log
          ls -l release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence
          path: |
            out/
            !out/**/*.vault
            !out/**/*.passphrase
          if-no-files-found: warn
          retention-days: 14

  scenarios:
    name: CI scenarios
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: dist
      - name: The step-by-step scenario (real tmux windows, every click-to-run block typed in)
        run: |
          docker run --rm --memory 12g -e KIT_BASE=file:///kit -e PROCESS_TIME_MS -e RETRACT_TIME_MS \
            -v "$PWD/killercoda/demo1-steps:/scenario:ro" -v "$PWD:/repo:ro" -v "$PWD/dist:/kit:ro" \
            ubuntu:24.04 bash /repo/demos/demo1/scenario-test.sh /scenario

  pay-by-name:
    name: CI pay-by-name
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: dist
      - name: The pay-by-name scenario (real tmux windows, every click-to-run block typed in), then its controls
        run: |
          docker run --rm --memory 12g -e KIT_BASE=file:///kit \
            -v "$PWD/killercoda/pay-by-name-steps:/scenario:ro" -v "$PWD:/repo:ro" -v "$PWD/dist:/kit:ro" \
            ubuntu:24.04 bash /repo/demos/pay-by-name/scenario-test.sh /scenario

  script-scenario:
    name: CI script scenario
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: dist
      - name: The annotated-script scenario
        run: |
          docker run --rm --memory 12g -e KIT_BASE=file:///kit \
            -v "$PWD/killercoda/demo1-script:/scenario:ro" -v "$PWD:/repo:ro" -v "$PWD/dist:/kit:ro" \
            ubuntu:24.04 bash /repo/demos/demo1/script-scenario-test.sh /scenario

  terminal:
    name: CI terminal
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: dist
      - name: The tutorial in a terminal from the kit (the stepper, its own tmux, clean Ubuntu with no network)
        env:
          IMAGE: ${{ env.UBUNTU_IMAGE }}
          OUT: out
        run: TARBALL=$(ls dist/*.tar.gz) kit/stepper-run.sh
      - name: The pay-by-name story in a terminal from the kit (the stepper, its own tmux and node, clean Ubuntu with no network)
        env:
          IMAGE: ${{ env.UBUNTU_IMAGE }}
          OUT: out
          SCENARIO: pay-by-name
        run: TARBALL=$(ls dist/*.tar.gz) kit/stepper-run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: terminal-evidence
          path: |
            out/
            !out/**/*.vault
          if-no-files-found: warn
          retention-days: 14

  homebrew:
    name: CI Homebrew
    # macOS cannot be proved on the nixos runners: this job installs singular-demo from a temporary local
    # tap built from the pull request and plays Demo 1's shortest path unattended. Nothing is pushed to
    # lambdasistemi/homebrew-tap; the release workflow owns the real tap.
    needs: kit
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pay-by-name-tools
          path: pr-tools
      - name: Point a local copy of the tap at the pull request
        run: |
          # The tarball carries demos/ beside one more top-level file, as the release's tag archive
          # carries demos/ beside the rest of the repository: Homebrew descends through single-child
          # directories, so a lone demos/ would install as demo1/ and pay-by-name/ instead.
          echo "tutorials of the pull request, for the temporary local tap" > /tmp/pr-note.txt
          tar -czf /tmp/pr-tutorials.tar.gz demos/demo1 demos/pay-by-name -C /tmp pr-note.txt
          # shellcheck disable=SC1091 # singular.env names the pinned Singular release's macOS bundle
          source homebrew/singular.env
          bash homebrew/render.sh --tag v0.0.0-local \
            --singular-version "$SINGULAR_VERSION" --singular-sha "$SINGULAR_SHA" \
            --local /tmp/pr-tutorials.tar.gz --tools-local pr-tools/pay-by-name-tools.tar.gz --out /tmp/Formula
          git clone --depth 1 https://github.com/lambdasistemi/homebrew-tap.git /tmp/tap
          cp "/tmp/Formula/singular@${SINGULAR_VERSION%.*}.rb" /tmp/Formula/singular-demo.rb /tmp/tap/Formula/
          # The tap is cloned, not copied: commit the rendered formulas locally (never pushed)
          # so the clone the tap is made from holds them.
          cd /tmp/tap
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "Formula/singular@${SINGULAR_VERSION%.*}.rb" Formula/singular-demo.rb
          git commit -qm "singular-demo from the pull request"
          cd "$GITHUB_WORKSPACE"
          brew tap lambdasistemi/tap /tmp/tap
          # A tap made from a local directory is untrusted: installing from it refuses to load
          # its own formulae as dependencies until it is trusted (brew says so itself).
          brew trust lambdasistemi/tap
      - name: Install singular-demo from the local tap
        run: |
          brew install lambdasistemi/tap/singular-demo
          brew test lambdasistemi/tap/singular-demo
      - name: Play Demo 1's shortest path unattended
        env:
          TMPDIR: /tmp
        run: |
          brew_bin="$(brew --prefix)/bin"
          export PATH="$brew_bin:$PATH"
          singular-demo --auto --path short --run /tmp/singular-demo-run --run-setup \
            --transcript /tmp/singular-demo-transcript.toml
          bash demos/demo1/play/check-receipts.sh /tmp/singular-demo-run
      - name: Keep the transcript of the run
        if: always()
        run: |
          mkdir -p homebrew-out
          cp /tmp/singular-demo-transcript.toml homebrew-out/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: homebrew-evidence
          path: homebrew-out/
          if-no-files-found: warn
          retention-days: 14

  tutorial:
    name: CI tutorial
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the tutorial's dependencies
        run: bash tutorial/setup.sh
      - name: The persistent shell and the access boundaries
        run: tutorial/.venv/bin/python tutorial/test_runner.py
      - name: Updating without rebuilding
        run: tutorial/.venv/bin/python tutorial/test-update.py
      - name: Install the browser
        working-directory: tutorial
        run: npx playwright install --with-deps chromium
      - name: The browser experience, the terminal theme
        working-directory: tutorial
        run: npm run test:browser
      - name: The whole demo through the browser
        working-directory: tutorial
        env:
          PLAY_KIT_BASE: file://${{ github.workspace }}/dist
        run: node test-demo.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tutorial-screenshots
          path: tutorial/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  docs:
    name: Docs build
    needs: [runbook, clean-room]
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runbook-transcript
          path: runbook-out
      - name: Build the site (mkdocs, --strict)
        run: |
          docs_env=$(nix build --no-link --print-out-paths .#docs-env)
          nix shell .#docs-env --command env PATH="$docs_env/bin" bash docs/build.sh runbook-out/stepper-transcript.toml release/demo-run.log
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
