name: CI

# Every pull request builds the Ubuntu kit of the pinned Singular release, checks the repository, proves the
# kit in a clean Ubuntu, plays the tutorial and its three environments (the Killercoda scenarios, the kit's
# drive.sh in a terminal and the Codespaces tutorial) on that kit, and builds the documentation site from the
# logs of those runs. publish.yml and release.yml call this workflow and publish what it produced.
#
# Jobs that need Nix run on the self-hosted nixos runners, after the Build Gate has built everything once.
# Six jobs need a real Ubuntu with Docker or the browser's system libraries, which the nixos runners do not
# have, and run on a GitHub-hosted runner: the clean-Ubuntu proof of the kit, the Killercoda scenarios (they
# run on an Ubuntu machine), the kit's drive.sh (in a clean Ubuntu container), the pay-by-name scenario and its
# controls (in a clean Ubuntu container) and the Codespaces tutorial (it runs in an Ubuntu container).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. A run called from another workflow has no pull
# request number and gets a group of its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  UBUNTU_IMAGE: mirror.gcr.io/library/ubuntu:24.04
  # A pull request plays every whole run with the least windows the registry allows (60 s to process a request,
  # 30 s to take it back), so its waits on the chain last a minute instead of several. The runs of main, the
  # nightly run and a release, whose logs are published, keep the windows the tutorial and demo.sh write.
  PROCESS_TIME_MS: ${{ github.event_name == 'pull_request' && '60000' || '' }}
  RETRACT_TIME_MS: ${{ github.event_name == 'pull_request' && '30000' || '' }}

jobs:
  build-gate:
    name: Build Gate
    runs-on: nixos
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Nothing may be compiled
        run: kit/guard.sh .#kit .#kit-verify .#pay-by-name-sink .#pay-by-name-tools .#docs-env .#devShells.x86_64-linux.default .#devShells.x86_64-linux.dev
      - name: Build everything the jobs below use
        run: >-
          nix build --quiet --no-link
          .#kit
          .#kit-verify
          .#pay-by-name-sink
          .#pay-by-name-tools
          .#docs-env
          .#devShells.x86_64-linux.default.inputDerivation
          .#devShells.x86_64-linux.dev.inputDerivation

  checks:
    name: CI checks
    needs: build-gate
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Flake checks (format, lint, generated files, the README's version)
        run: nix flake check --no-eval-cache

  kit:
    name: CI kit
    needs: build-gate
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: The shell starts
        run: nix develop --command kit/smoke.sh
      - name: Build the kit
        run: |
          nix build .#kit --print-build-logs --out-link kit-result
          nix build .#pay-by-name-tools --print-build-logs --out-link tools-result
          mkdir dist
          cp kit-result/* dist/
          # the controls only the pay-by-name test runs; they are not part of the kit
          cp tools-result/controls.cjs dist/
          nix --version > dist/nix-version.txt
          ls -l dist
          cat dist/SHA256SUMS
      - name: Verify the tarball contents
        run: nix run .#kit-verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit
          path: dist/
          if-no-files-found: error
          retention-days: 3

  runbook:
    name: CI runbook
    needs: build-gate
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Every step of the tutorial, pasted into one shell, against a fresh devnet
        run: nix develop --command bash demos/demo1/test.sh
      - name: Keep the log of the run
        if: always()
        run: |
          mkdir -p runbook-out
          cp /tmp/rb-*/log.txt runbook-out/runbook-test.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runbook-log
          path: runbook-out/
          if-no-files-found: warn
          retention-days: 14

  clean-room:
    name: CI clean Ubuntu
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: dist
      - name: Pull the Ubuntu image
        id: image
        run: |
          docker pull "$UBUNTU_IMAGE"
          ref=$(docker image inspect "$UBUNTU_IMAGE" --format '{{json .RepoDigests}}' \
            | jq -r --arg r "${UBUNTU_IMAGE%:*}@" '.[] | select(startswith($r))')
          [ -n "$ref" ] || { echo "no digest for $UBUNTU_IMAGE" >&2; exit 1; }
          echo "image $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
      - name: Demo in clean Ubuntu 24.04 (16 steps, no /nix, no network)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          OUT: out
        run: TARBALL=$(ls dist/*.tar.gz) kit/container-run.sh good
      - name: Demo with the shortest allowed windows (60 s and 30 s)
        # a pull request already ran the demo above with these windows
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          OUT: out
        run: TARBALL=$(ls dist/*.tar.gz) kit/container-run.sh short
      - name: Failing control, windows below the least allowed (must be refused)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          OUT: out
        run: TARBALL=$(ls dist/*.tar.gz) kit/container-run.sh control-window
      - name: Failing control, a library of the programs removed (must fail)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          OUT: out
        run: TARBALL=$(ls dist/*.tar.gz) kit/container-run.sh control-main
      - name: Failing control, a library of cardano-node removed (must fail)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          OUT: out
        run: TARBALL=$(ls dist/*.tar.gz) kit/container-run.sh control-node
      - name: Summary and release files
        env:
          DIST: dist
          LOG: out/container-run-good.log
          IMAGE_REF: ${{ env.UBUNTU_IMAGE }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KIT_COMMIT: ${{ github.sha }}
        run: |
          NIX_VERSION=$(cat dist/nix-version.txt)
          RUNNER_IMAGE="${ImageOS:-unknown} ${ImageVersion:-unknown}"
          export NIX_VERSION RUNNER_IMAGE
          mkdir release
          kit/summary.sh json > release/run-summary.json
          cat release/run-summary.json
          [ "$(jq -r .result release/run-summary.json)" = pass ]
          SUMMARY=release/run-summary.json kit/summary.sh notes > release/notes.md
          SUMMARY=release/run-summary.json kit/summary.sh release-notes > release/release-notes.md
          cp dist/*.tar.gz dist/SHA256SUMS release/
          cp out/container-run-good.log release/demo-run.log
          ls -l release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence
          path: |
            out/
            !out/**/*.vault
            !out/**/*.passphrase
          if-no-files-found: warn
          retention-days: 14

  scenarios:
    name: CI scenarios
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: dist
      - name: The step-by-step scenario (real tmux windows, every click-to-run block typed in)
        run: |
          docker run --rm --memory 12g -e KIT_BASE=file:///kit -e PROCESS_TIME_MS -e RETRACT_TIME_MS \
            -v "$PWD/killercoda/demo1-steps:/scenario:ro" -v "$PWD:/repo:ro" -v "$PWD/dist:/kit:ro" \
            ubuntu:24.04 bash /repo/demos/demo1/scenario-test.sh /scenario

  pay-by-name:
    name: CI pay-by-name
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: dist
      - name: The pay-by-name scenario (real tmux windows, every click-to-run block typed in), then its controls
        run: |
          docker run --rm --memory 12g -e KIT_BASE=file:///kit \
            -v "$PWD/killercoda/pay-by-name-steps:/scenario:ro" -v "$PWD:/repo:ro" -v "$PWD/dist:/kit:ro" \
            ubuntu:24.04 bash /repo/demos/pay-by-name/scenario-test.sh /scenario

  script-scenario:
    name: CI script scenario
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: dist
      - name: The annotated-script scenario
        run: |
          docker run --rm --memory 12g -e KIT_BASE=file:///kit \
            -v "$PWD/killercoda/demo1-script:/scenario:ro" -v "$PWD:/repo:ro" -v "$PWD/dist:/kit:ro" \
            ubuntu:24.04 bash /repo/demos/demo1/script-scenario-test.sh /scenario

  terminal:
    name: CI terminal
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: dist
      - name: The tutorial in a terminal from the kit (drive.sh, its own tmux, clean Ubuntu with no network)
        env:
          IMAGE: ${{ env.UBUNTU_IMAGE }}
          OUT: out
        run: TARBALL=$(ls dist/*.tar.gz) kit/drive-run.sh
      - name: The pay-by-name story in a terminal from the kit (drive.sh pay-by-name, its own tmux and node, clean Ubuntu with no network)
        env:
          IMAGE: ${{ env.UBUNTU_IMAGE }}
          OUT: out
          SCENARIO: pay-by-name
        run: TARBALL=$(ls dist/*.tar.gz) kit/drive-run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: terminal-evidence
          path: |
            out/
            !out/**/*.vault
          if-no-files-found: warn
          retention-days: 14

  tutorial:
    name: CI tutorial
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the tutorial's dependencies
        run: bash tutorial/setup.sh
      - name: The persistent shell and the access boundaries
        run: tutorial/.venv/bin/python tutorial/test_runner.py
      - name: Updating without rebuilding
        run: tutorial/.venv/bin/python tutorial/test-update.py
      - name: Install the browser
        working-directory: tutorial
        run: npx playwright install --with-deps chromium
      - name: The browser experience, the terminal theme
        working-directory: tutorial
        run: npm run test:browser
      - name: The whole demo through the browser
        working-directory: tutorial
        env:
          PLAY_KIT_BASE: file://${{ github.workspace }}/dist
        run: node test-demo.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tutorial-screenshots
          path: tutorial/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  docs:
    name: Docs build
    needs: [runbook, clean-room]
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runbook-log
          path: runbook-out
      - name: Build the site (mkdocs, --strict)
        run: nix shell .#docs-env --command bash docs/build.sh runbook-out/runbook-test.log release/demo-run.log
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
