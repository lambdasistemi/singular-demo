name: release

# Pushing a tag vX.Y.Z builds the Ubuntu kit of the pinned Singular release from flake.lock, proves it
# with the same jobs as the daily run, and publishes the numbered release: the tarball, its checksum,
# the full log of the demo run and the run summary. The tag must name the Singular version the kit
# was built from. The release is created once and never overwritten.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/kit.yml
    permissions:
      contents: read

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: The tag names the Singular version of the kit
        run: |
          built=$(jq -r .singular_tag release/run-summary.json)
          [ "$built" = "$TAG" ] || { echo "::error::the tag is $TAG but the kit was built from Singular $built" >&2; exit 1; }
          [ "$(jq -r .result release/run-summary.json)" = pass ] || { echo "::error::the demo run did not pass" >&2; exit 1; }
          test -f "release/singular-demo-$TAG-x86_64-linux.tar.gz"
          (cd release && sha256sum -c SHA256SUMS)

      - name: Create the release
        run: |
          gh release create "$TAG" --verify-tag --latest \
            --title "Singular $TAG Demo 1 kit for Ubuntu 24.04 (x86_64)" \
            --notes-file release/release-notes.md \
            release/*.tar.gz release/SHA256SUMS release/demo-run.log release/run-summary.json
