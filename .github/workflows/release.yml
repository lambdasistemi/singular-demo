name: release

# Pushing a tag vX.Y.Z-N runs the whole CI on the kit of the pinned Singular release and then publishes the
# numbered release: the tarball, its checksum, the full log of the demo run and the run summary. The tag must
# name the kit that was built: the pinned Singular release and the kit's revision (kit/revision), as in v0.14.0-1.
# The release is created once and never overwritten.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the release
    needs: ci
    runs-on: nixos
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: The tag names the kit that was built
        run: nix develop .#dev --command bash kit/check-release.sh "$TAG"
      - name: Create the release
        run: |
          nix develop .#dev --command gh release create "$TAG" --verify-tag --latest \
            --title "Demo 1 kit $TAG for Ubuntu 24.04 (x86_64)" \
            --notes-file release/release-notes.md \
            release/*.tar.gz release/SHA256SUMS release/demo-run.log release/run-summary.json
